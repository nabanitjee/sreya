<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sreya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card" id="step1">
        <h1>Hey Sreya...</h1>
        <button onclick="next(2)">Open Gift</button>
    </div>
    
    <!-- Steps 2 through 5 follow the same structure -->
    <div class="card hidden" id="step2">
        <p>19 years later and you're still not an adult. 😜</p>
        <button onclick="next(3)">Next</button>
    </div>
    
    <div class="card hidden" id="step3">
        <p>I was going to get you a gift, but then I remembered my presence is clearly the best thing that ever happened to you.</p>
        <button onclick="next(4)">More</button>
    </div>
    
    <div class="card hidden" id="step4">
        <div class="gallery">
            <img src="photo1.jpg" alt="Memory">
            <img src="photo2.jpg" alt="Memory">
            <img src="photo3.jpg" alt="Memory">
        </div>
        <button onclick="next(5)">Final Wish</button>
    </div>
    
    <div class="card hidden" id="step5">
        <h1>Happy Birthday Sreya! 🎂</h1>
        <p>I'll be busy with JEE, but don't think you can get rid of me that easily!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
